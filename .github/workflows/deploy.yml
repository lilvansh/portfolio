name: Build and publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the portfolio
        run: npm run build

      - name: Publish compiled files for GitHub Pages
        shell: bash
        run: |
          rm -rf assets docs/assets
          cp -R dist/. .
          mkdir -p docs
          cp -R dist/. docs/
          touch .nojekyll docs/.nojekyll

      - name: Commit the production build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production files are already current."
          else
            git commit -m "chore: publish portfolio build"
            git push origin main
          fi
