<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#232830" stroke-width="1"/>
  </pattern>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b6dff" stop-opacity=".32"/><stop offset="1" stop-color="#ff6b2c" stop-opacity=".08"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1d2229"/><stop offset="1" stop-color="#13171c"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="smallGlow"><feGaussianBlur stdDeviation="5"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L0 6L8 3Z" fill="#8b6dff"/></marker>
</defs>
<rect width="1200" height="900" rx="32" fill="#101318"/>
<rect width="1200" height="900" rx="32" fill="url(#grid)" opacity=".72"/>
<circle cx="216" cy="108" r="170" fill="#8b6dff" fill-opacity=".12" filter="url(#blur)"/>
<circle cx="1056" cy="765" r="190" fill="#ff6b2c" fill-opacity=".10" filter="url(#blur)"/>
<text x="64" y="74" fill="#8b6dff" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" text-anchor="start" letter-spacing="2.3">PLANNED CONTROL PATH</text>
<rect x="55" y="310" width="170" height="205" rx="18" fill="url(#panel)" stroke="#343a43" stroke-width="1" opacity="1"/><circle cx="140" cy="365" r="34" fill="#11151a" stroke="#8b6dff" stroke-width="2"/><text x="140" y="371" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.2">01</text>
<text x="75" y="430" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.7">CAMERA</text>
<text x="75" y="462" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">Acquire work-cell image</text>
<path d="M225 410L285 410" stroke="#8b6dff" stroke-width="2" opacity="0.85" stroke-dasharray="7 8" marker-end="url(#arrow)"/><rect x="285" y="310" width="170" height="205" rx="18" fill="url(#panel)" stroke="#343a43" stroke-width="1" opacity="1"/><circle cx="370" cy="365" r="34" fill="#11151a" stroke="#8b6dff" stroke-width="2"/><text x="370" y="371" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.2">02</text>
<text x="305" y="430" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.7">VISION</text>
<text x="305" y="462" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">Detect + localize</text>
<text x="305" y="482" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">part</text>
<path d="M455 410L515 410" stroke="#8b6dff" stroke-width="2" opacity="0.85" stroke-dasharray="7 8" marker-end="url(#arrow)"/><rect x="515" y="310" width="170" height="205" rx="18" fill="url(#panel)" stroke="#343a43" stroke-width="1" opacity="1"/><circle cx="600" cy="365" r="34" fill="#11151a" stroke="#8b6dff" stroke-width="2"/><text x="600" y="371" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.2">03</text>
<text x="535" y="430" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.7">TRANSFORM</text>
<text x="535" y="462" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">Map into robot</text>
<text x="535" y="482" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">frame</text>
<path d="M685 410L745 410" stroke="#ff6b2c" stroke-width="2" opacity="0.85" stroke-dasharray="7 8" marker-end="url(#arrow)"/><rect x="745" y="310" width="170" height="205" rx="18" fill="url(#panel)" stroke="#343a43" stroke-width="1" opacity="1"/><circle cx="830" cy="365" r="34" fill="#11151a" stroke="#ff6b2c" stroke-width="2"/><text x="830" y="371" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.2">04</text>
<text x="765" y="430" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.7">ROBOT CONTROL</text>
<text x="765" y="462" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">Plan + execute</text>
<text x="765" y="482" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">motion</text>
<path d="M915 410L975 410" stroke="#ff6b2c" stroke-width="2" opacity="0.85" stroke-dasharray="7 8" marker-end="url(#arrow)"/><rect x="975" y="310" width="170" height="205" rx="18" fill="url(#panel)" stroke="#343a43" stroke-width="1" opacity="1"/><circle cx="1060" cy="365" r="34" fill="#11151a" stroke="#ff6b2c" stroke-width="2"/><text x="1060" y="371" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.2">05</text>
<text x="995" y="430" fill="#f4f1e9" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.7">VERIFY</text>
<text x="995" y="462" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">Confirm placement state</text>
<text x="600" y="660" fill="#8d9199" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0">Detection is only one stage. Calibration, coordinate integrity, safe motion, and verification complete the system.</text>
</svg>
